[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ufosay"
version = "1.0.0"
description = "A flying saucer terminal animation tool (like sl meets cowsay)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
ufosay = "ufosay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
